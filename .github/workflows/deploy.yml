name: Build and Deploy Frontend

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: 43.133.155.164
      DEPLOY_PORT: "22"
      DEPLOY_USER: ian
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
      DEPLOY_PATH: /var/www/ini-vie/frontend-web
      DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
      SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production assets
        run: npm run build

      - name: Prepare SSH client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p "$RUNNER_TEMP/ssh"
          chmod 700 "$RUNNER_TEMP/ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -t ed25519 "$DEPLOY_HOST" > "$RUNNER_TEMP/ssh/known_hosts" 2>/dev/null
          ACTUAL_HOST_KEY=$(ssh-keygen -lf "$RUNNER_TEMP/ssh/known_hosts" -E sha256 | awk '{print $2}')
          test "$ACTUAL_HOST_KEY" = "$DEPLOY_HOST_KEY"

      - name: Deploy frontend to VPS
        run: |
          sshpass -e ssh -4 -p "$DEPLOY_PORT" \
            -o ConnectTimeout=60 \
            -o ServerAliveInterval=60 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail
          APP_PATH="$1"
          cd "$APP_PATH"

          CURRENT_BRANCH="$(git branch --show-current)"
          test "$CURRENT_BRANCH" = "master" || {
            echo "Expected master checkout, found: $CURRENT_BRANCH" >&2
            exit 1
          }
          test -z "$(git status --porcelain)" || {
            echo "Dirty VPS checkout; deployment stopped for safety." >&2
            exit 1
          }

          git fetch origin master
          git reset --hard origin/master
          npm ci
          npm run build

          export PATH="$HOME/.hermes/node/bin:$PATH"
          pm2 reload ini-vie --update-env

          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors --retry-max-time 45 http://127.0.0.1:3201/ >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 1 --retry-all-errors --retry-max-time 20 https://inivie.iandev.my.id/ >/dev/null
          REMOTE
